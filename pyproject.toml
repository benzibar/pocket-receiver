[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-receiver"
version = "0.2.1"
description = "Compact RTL-SDR audio receiver for the PocketTerm35"
requires-python = ">=3.11"
dependencies = ["textual>=0.70"]

[project.scripts]
pocket-receiver = "pocket_receiver.app:main"

[tool.setuptools.packages.find]
where = ["src"]
